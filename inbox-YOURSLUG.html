<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLIPBOX INBOX </title>
<!-- noindex so search engines won't find it -->
<meta name="robots" content="noindex, nofollow" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<!-- config (needs github token + inboxSlug) -->
<script src="config/socials.js"></script>

<!-- ============================================================
  inbox.html — YOUR private blip reader
  this file is generated with your inboxSlug baked in.
  the actual filename is: inbox-YOURSLUG.html

  SECTIONS:
  1. STYLES   → below
  2. HTML     → mid-file
  3. ENGINE   → bottom script — fetches + renders issues
============================================================ -->

<style>
/* ============================================================
   1. STYLES
   ============================================================ */

:root {
  --bg:       #0f0f14;
  --surface:  #17171f;
  --surface2: #1e1e28;
  --border:   rgba(255,255,255,0.07);
  --accent:   #ff6b35;
  --accent2:  #ffb830;
  --accent3:  #4ecdc4;
  --text:     #e8e8f0;
  --muted:    #666680;
  --green:    #4ecdc4;
  --red:      #ff6b6b;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
}

.page {
  max-width: 760px;
  margin: 0 auto;
  padding: 56px 24px 100px;
}

/* -- header -- */
.inbox-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
  flex-wrap: wrap;
  gap: 16px;
}
.inbox-title {
  font-size: 28px;
  font-weight: 900;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 12px;
}
.inbox-title span { font-size: 28px; }

.badge-count {
  background: var(--accent);
  color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
}

.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.btn-sm {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 7px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-sm:hover { border-color: var(--accent); color: var(--text); }
.btn-sm.danger:hover { border-color: var(--red); color: var(--red); }

/* -- filters -- */
.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.filter-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.12s;
}
.filter-btn:hover  { border-color: var(--accent2); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* -- loading / empty -- */
.state-msg {
  text-align: center;
  padding: 80px 24px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  line-height: 2;
}
.state-msg .big { font-size: 40px; display: block; margin-bottom: 16px; }
.spinner-large {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* -- blip cards -- */
.blip-list { display: flex; flex-direction: column; gap: 16px; }

.blip-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: border-color 0.15s;
  animation: slideup 0.3s ease both;
}
.blip-card:hover { border-color: rgba(255,107,53,0.3); }
@keyframes slideup { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }

.blip-card.is-closed { opacity: 0.45; }
.blip-card.is-closed:hover { opacity: 0.7; }

.blip-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 0;
  gap: 12px;
  flex-wrap: wrap;
}
.blip-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.blip-num {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  font-weight: 700;
}
.blip-time {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.tag {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid;
}
.tag.drawing { border-color: rgba(78,205,196,0.4); color: var(--accent3); background: rgba(78,205,196,0.08); }
.tag.closed  { border-color: rgba(255,107,107,0.3); color: var(--red);    background: rgba(255,107,107,0.06); }
.tag.open    { border-color: rgba(78,205,196,0.3);  color: var(--green);  background: rgba(78,205,196,0.06); }

.blip-actions { display: flex; gap: 8px; }

.blip-body {
  padding: 14px 20px 20px;
}
.blip-message {
  font-size: 15px;
  line-height: 1.65;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}

.blip-drawing {
  margin-top: 16px;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface2);
  max-width: 100%;
}
.blip-drawing img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;
}

/* -- pagination -- */
.pagination {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 32px;
}
.page-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  padding: 8px 18px;
  cursor: pointer;
  transition: all 0.12s;
}
.page-btn:hover    { border-color: var(--accent); color: var(--text); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* -- toast -- */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 18px;
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  color: var(--text);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.2s;
  pointer-events: none;
  z-index: 100;
}
.toast.show { opacity: 1; transform: none; }

@media (max-width: 500px) {
  .page { padding: 32px 14px 80px; }
  .blip-top { flex-direction: column; align-items: flex-start; }
}
</style>
</head>

<!-- ============================================================
   2. HTML
   ============================================================ -->
<body>

<div class="page">

  <div class="inbox-header">
    <div class="inbox-title">
      <span>📬</span>
      your blips
      <span class="badge-count" id="blipCount">—</span>
    </div>
    <div class="header-actions">
      <button class="btn-sm" onclick="loadBlips()">↺ refresh</button>
      <a class="btn-sm" href="index.html" target="_blank">↗ public page</a>
    </div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',   this)">all</button>
    <button class="filter-btn"        onclick="setFilter('open',  this)">unread (open)</button>
    <button class="filter-btn"        onclick="setFilter('closed',this)">read (closed)</button>
    <button class="filter-btn"        onclick="setFilter('drawing',this)">has drawing 🎨</button>
  </div>

  <div id="blipList" class="blip-list"></div>

  <div class="pagination" id="pagination" style="display:none;">
    <button class="page-btn" id="prevBtn" onclick="changePage(-1)">← prev</button>
    <span style="font-family:'Space Mono',monospace; font-size:12px; color:var(--muted); padding:8px 4px;" id="pageLabel"></span>
    <button class="page-btn" id="nextBtn" onclick="changePage(1)">next →</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- ============================================================
   3. ENGINE — fetches github issues and renders them
   ============================================================ -->
<script>
// -- state ----------------------------------------------------
let allBlips    = [];
let currentFilter = 'all';
let currentPage   = 1;
const PER_PAGE    = 10;

// -- guard: check slug matches --------------------------------
// The inbox file is named inbox-YOURSLUG.html
// If someone guesses a wrong slug they just get a 404 from github pages
// (because the file won't exist with that name)

// -- init -----------------------------------------------------
window.addEventListener('DOMContentLoaded', () => {
  loadBlips();
});

// -- fetch from github ----------------------------------------
async function loadBlips() {
  const list = document.getElementById('blipList');
  list.innerHTML = `<div class="state-msg"><div class="spinner-large"></div>fetching blips...</div>`;
  document.getElementById('pagination').style.display = 'none';

  const { owner, repo, token } = BLIPBOX_CONFIG.github;

  try {
    // fetch all issues (open + closed), up to 100
    const res = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/issues?state=all&per_page=100&labels=blip`,
      {
        headers: {
          'Authorization':        `Bearer ${token}`,
          'Accept':               'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
        },
      }
    );

    if (!res.ok) {
      const err = await res.json();
      list.innerHTML = `<div class="state-msg"><span class="big">⚠️</span>github error: ${err.message || res.status}</div>`;
      return;
    }

    allBlips = await res.json();
    document.getElementById('blipCount').textContent = allBlips.length;
    currentPage = 1;
    renderBlips();

  } catch (e) {
    list.innerHTML = `<div class="state-msg"><span class="big">📡</span>network error — are you online?</div>`;
  }
}

// -- filter + paginate + render -------------------------------
function renderBlips() {
  const filtered = applyFilter(allBlips, currentFilter);
  const total    = filtered.length;
  const pages    = Math.ceil(total / PER_PAGE);
  const slice    = filtered.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

  const list = document.getElementById('blipList');

  if (total === 0) {
    list.innerHTML = `<div class="state-msg"><span class="big">🌵</span>no blips here yet.</div>`;
    document.getElementById('pagination').style.display = 'none';
    return;
  }

  list.innerHTML = '';
  slice.forEach((issue, i) => {
    list.appendChild(buildCard(issue, i));
  });

  // pagination
  if (pages > 1) {
    document.getElementById('pagination').style.display = 'flex';
    document.getElementById('pageLabel').textContent    = `${currentPage} / ${pages}`;
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= pages;
  } else {
    document.getElementById('pagination').style.display = 'none';
  }
}

function applyFilter(blips, filter) {
  if (filter === 'open')    return blips.filter(b => b.state === 'open');
  if (filter === 'closed')  return blips.filter(b => b.state === 'closed');
  if (filter === 'drawing') return blips.filter(b => b.labels.some(l => l.name === 'has-drawing'));
  return blips;
}

// -- build a single card --------------------------------------
function buildCard(issue, index) {
  const card = document.createElement('div');
  card.className = `blip-card${issue.state === 'closed' ? ' is-closed' : ''}`;
  card.style.animationDelay = `${index * 0.04}s`;

  const isClosed  = issue.state === 'closed';
  const hasDrawing = issue.labels.some(l => l.name === 'has-drawing');
  const time      = new Date(issue.created_at).toLocaleString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric',
    hour: '2-digit', minute: '2-digit',
  });

  // parse message text from body (strip the "**Message:**" and footer)
  const msg     = parseMessage(issue.body);
  const imgUrl  = parseDrawingUrl(issue.body);

  card.innerHTML = `
    <div class="blip-top">
      <div class="blip-meta">
        <span class="blip-num">#${issue.number}</span>
        <span class="blip-time">${time}</span>
        <span class="tag ${isClosed ? 'closed' : 'open'}">${isClosed ? 'read' : 'unread'}</span>
        ${hasDrawing ? '<span class="tag drawing">🎨 drawing</span>' : ''}
      </div>
      <div class="blip-actions">
        <button class="btn-sm" onclick="toggleRead(${issue.number}, ${isClosed}, this)">
          ${isClosed ? '↩ mark unread' : '✓ mark read'}
        </button>
        <button class="btn-sm danger" onclick="deleteBlip(${issue.number}, this)">🗑</button>
      </div>
    </div>
    <div class="blip-body">
      <div class="blip-message">${escHtml(msg)}</div>
      ${imgUrl ? `<div class="blip-drawing"><img src="${imgUrl}" alt="drawing" loading="lazy" /></div>` : ''}
    </div>
  `;

  return card;
}

// -- parse helpers --------------------------------------------
function parseMessage(body) {
  if (!body) return '(empty)';
  // extract between "**Message:**\n\n" and "\n\n---"
  const match = body.match(/\*\*Message:\*\*\n\n([\s\S]*?)\n\n---/);
  return match ? match[1].trim() : body.trim();
}

function parseDrawingUrl(body) {
  if (!body) return null;
  const match = body.match(/!\[drawing\]\((https?:\/\/[^\)]+)\)/);
  return match ? match[1] : null;
}

function escHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// -- actions --------------------------------------------------
async function toggleRead(number, isClosed, btn) {
  const { owner, repo, token } = BLIPBOX_CONFIG.github;
  const newState = isClosed ? 'open' : 'closed';
  btn.textContent = '...';
  btn.disabled = true;

  const res = await fetch(
    `https://api.github.com/repos/${owner}/${repo}/issues/${number}`,
    {
      method: 'PATCH',
      headers: {
        'Authorization':        `Bearer ${token}`,
        'Content-Type':         'application/json',
        'Accept':               'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
      body: JSON.stringify({ state: newState }),
    }
  );

  if (res.ok) {
    toast(newState === 'closed' ? '✓ marked as read' : '↩ marked as unread');
    loadBlips();
  } else {
    btn.textContent = 'error';
    btn.disabled = false;
  }
}

async function deleteBlip(number, btn) {
  // github doesn't allow deleting issues via API — we close + lock instead
  if (!confirm('archive this blip? (github issues cant be deleted via API, so it will be closed + locked)')) return;
  const { owner, repo, token } = BLIPBOX_CONFIG.github;
  btn.textContent = '...';
  btn.disabled = true;

  await fetch(
    `https://api.github.com/repos/${owner}/${repo}/issues/${number}`,
    {
      method: 'PATCH',
      headers: {
        'Authorization':        `Bearer ${token}`,
        'Content-Type':         'application/json',
        'Accept':               'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
      },
      body: JSON.stringify({ state: 'closed', state_reason: 'not_planned' }),
    }
  );

  toast('🗑 archived');
  loadBlips();
}

// -- pagination -----------------------------------------------
function changePage(dir) {
  currentPage += dir;
  renderBlips();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// -- filter ---------------------------------------------------
function setFilter(f, el) {
  currentFilter = f;
  currentPage   = 1;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderBlips();
}

// -- toast helper ---------------------------------------------
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>

</body>
</html>
